<div id="setup">
  <h1>Moderator-Free Mafia Setup</h1>
  <label>Number of Players: <input type="number" id="numPlayers" min="4" max="15" value="7"></label><br>
  <button onclick="startPlayerSetup()">Start</button>
</div>

<div id="playerCycle" class="hidden">
  <h2 id="playerPrompt">Player 1, pick up the phone!</h2>
  <div id="nameInputArea">
    <input type="text" id="playerNameInput" placeholder="Enter your name">
    <button onclick="submitName()">Submit</button>
  </div>
  <div id="roleReveal" class="hidden">
    <p>Your role is: <span id="playerRole"></span></p>
    <button onclick="nextPlayer()">Next Player</button>
  </div>
</div>

<script>
// Players data
let numPlayers;
let players = [];
let roleList = ['Mafia','Mafia','Detective','Doctor','Jester']; // default roles, extra players will be Villagers
let currentPlayer = 0;

function startPlayerSetup() {
  numPlayers = parseInt(document.getElementById('numPlayers').value);
  // hide setup, show player cycle
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('playerCycle').classList.remove('hidden');

  // Prepare players array
  players = [];
  for (let i = 0; i < numPlayers; i++) {
    players.push({name:'', role:''});
  }

  // Prepare role list
  let assignedRoles = [...roleList];
  while (assignedRoles.length < numPlayers) {
    assignedRoles.push('Villager');
  }
  assignedRoles = shuffleArray(assignedRoles);

  // Assign roles
  players.forEach((p,i)=>p.role=assignedRoles[i]);

  // Set prompt for first player
  document.getElementById('playerPrompt').textContent = `Player 1, pick up the phone!`;
}

function submitName() {
  const nameInput = document.getElementById('playerNameInput');
  const name = nameInput.value.trim() || `Player ${currentPlayer+1}`;
  players[currentPlayer].name = name;

  // Show role
  document.getElementById('nameInputArea').classList.add('hidden');
  document.getElementById('roleReveal').classList.remove('hidden');
  document.getElementById('playerRole').textContent = players[currentPlayer].role;

  // Optionally: you can add audio for the role here
}

function nextPlayer() {
  // Reset input area
  document.getElementById('nameInputArea').classList.remove('hidden');
  document.getElementById('playerNameInput').value = '';
  document.getElementById('roleReveal').classList.add('hidden');

  currentPlayer++;
  if(currentPlayer < numPlayers){
    document.getElementById('playerPrompt').textContent = `${currentPlayer+1}º Player, pick up the phone!`;
  } else {
    document.getElementById('playerCycle').classList.add('hidden');
    // Move to night phase here
    startNightPhase();
  }
}

// Utility: shuffle array
function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}
</script>
