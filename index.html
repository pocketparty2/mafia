<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mafia Game</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #222; color: #eee; padding: 20px; }
  button { margin: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  input { padding: 5px; font-size: 14px; margin: 5px; }
  #nameInputs input { display: block; margin: 10px auto; width: 200px; }
  h1,h2 { margin-bottom: 20px; }
  #gameArea { margin-top: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>Moderator-Free Mafia</h1>

<div id="setup">
  <label>Number of Players: <input type="number" id="numPlayers" min="4" max="15" value="7"></label><br>
  <button onclick="startSetup()">Start Setup</button>
</div>

<div id="playerNames" class="hidden">
  <h2>Enter Player Names</h2>
  <div id="nameInputs"></div>
  <button onclick="assignRoles()">Assign Roles</button>
</div>

<div id="gameArea" class="hidden">
  <h2 id="phaseTitle">Night Phase</h2>
  <div id="actionArea"></div>
  <button id="nextButton" class="hidden" onclick="nextAction()">Next</button>
  <div id="message"></div>
</div>

<script>
let numPlayers, players=[], currentPlayer=0, nightStep=0;
let mafiaTarget=null, doctorTarget=null, detectiveTarget=null;

const roleList = ['Mafia', 'Mafia', 'Detective', 'Doctor', 'Jester'];

function startSetup() {
  numPlayers = parseInt(document.getElementById('numPlayers').value);
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('playerNames').classList.remove('hidden');

  const inputsDiv = document.getElementById('nameInputs');
  inputsDiv.innerHTML = '';
  for(let i=0;i<numPlayers;i++){
    const input = document.createElement('input');
    input.placeholder = 'Player '+(i+1);
    inputsDiv.appendChild(input);
  }
}

function assignRoles() {
  const inputs = document.querySelectorAll('#nameInputs input');
  players = Array.from(inputs).map(input => ({
    name: input.value || 'Player',
    role: '',
    alive: true
  }));

  // Fill roles
  let assignedRoles = [...roleList];
  while(assignedRoles.length < numPlayers) assignedRoles.push('Villager');
  assignedRoles = shuffleArray(assignedRoles);
  players.forEach((p,i)=>p.role=assignedRoles[i]);

  document.getElementById('playerNames').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');

  startNight();
}

function startNight() {
  nightStep = 0;
  currentPlayer = 0;
  mafiaTarget = null;
  doctorTarget = null;
  detectiveTarget = null;
  document.getElementById('phaseTitle').textContent = "Night Phase";
  nextAction();
}

function nextAction() {
  const actionDiv = document.getElementById('actionArea');
  actionDiv.innerHTML = '';
  document.getElementById('nextButton').classList.add('hidden');
  document.getElementById('message').textContent = '';

  // Mafia choose target first
  if(nightStep===0){
    const mafiaPlayers = players.filter(p=>p.alive && p.role==='Mafia');
    if(currentPlayer < mafiaPlayers.length){
      const p = mafiaPlayers[currentPlayer];
      actionDiv.innerHTML = `<h3>${p.name} (Mafia) - choose a target</h3>`;
      createTargetButtons('mafia');
    } else {
      nightStep++;
      currentPlayer=0;
      nextAction();
    }
  }

  // Doctor chooses save
  else if(nightStep===1){
    const doctor = players.find(p=>p.alive && p.role==='Doctor');
    if(doctor){
      actionDiv.innerHTML = `<h3>${doctor.name} (Doctor) - choose someone to save</h3>`;
      createTargetButtons('doctor');
    } else {
      nightStep++;
      nextAction();
    }
  }

  // Detective chooses check
  else if(nightStep===2){
    const detective = players.find(p=>p.alive && p.role==='Detective');
    if(detective){
      actionDiv.innerHTML = `<h3>${detective.name} (Detective) - choose someone to check</h3>`;
      createTargetButtons('detective');
    } else {
      nightStep++;
      nextAction();
    }
  }

  // Resolve night
  else {
    resolveNight();
  }
}

function createTargetButtons(roleType){
  const actionDiv = document.getElementById('actionArea');
  players.forEach(p=>{
    if(p.alive){
      const btn = document.createElement('button');
      btn.textContent = p.name;
      btn.onclick = ()=>{
        if(roleType==='mafia') mafiaTarget = p.name;
        if(roleType==='doctor') doctorTarget = p.name;
        if(roleType==='detective') detectiveTarget = p.name;
        currentPlayer++;
        nextAction();
      }
      actionDiv.appendChild(btn);
    }
  });
}

function resolveNight(){
  const actionDiv = document.getElementById('actionArea');
  let dead=null;
  if(mafiaTarget && mafiaTarget !== doctorTarget){
    dead = players.find(p=>p.name===mafiaTarget);
    dead.alive = false;
  }

  actionDiv.innerHTML = `<h3>Night Results</h3>`;
  if(dead){
    actionDiv.innerHTML += `<p>${dead.name} was killed during the night!</p>`;
  } else {
    actionDiv.innerHTML += `<p>No one died.</p>`;
  }

  // Detective result
  if(detectiveTarget){
    const checked = players.find(p=>p.name===detectiveTarget);
    document.getElementById('message').textContent = `${players.find(p=>p.role==='Detective').name}, ${checked.name}'s role is ${checked.role}`;
  }

  // Prepare for next night/day
  const aliveMafia = players.filter(p=>p.alive && p.role==='Mafia').length;
  const aliveTown = players.filter(p=>p.alive && p.role!=='Mafia').length;
  if(aliveMafia===0){
    actionDiv.innerHTML += `<h3>Town wins!</h3>`;
  } else if(aliveMafia >= aliveTown){
    actionDiv.innerHTML += `<h3>Mafia wins!</h3>`;
  } else {
    actionDiv.innerHTML += `<button onclick="startNight()">Next Night</button>`;
  }
}

function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i], array[j]]=[array[j], array[i]];
  }
  return array;
}
</script>
</body>
</html>
