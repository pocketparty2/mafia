<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mafia Game</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #222; color: #eee; padding: 20px; }
  input, button { font-size: 16px; margin: 5px; padding: 10px; }
  #nameInputs input { display: block; margin: 10px auto; width: 200px; }
  h1,h2 { margin-bottom: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>Moderator-Free Mafia</h1>

<div id="setup">
  <label>Number of Players: <input type="number" id="numPlayers" min="4" max="15" value="7"></label><br>
  <button onclick="startSetup()">Start Setup</button>
</div>

<div id="playerNames" class="hidden">
  <h2>Enter Player Names</h2>
  <div id="nameInputs"></div>
  <button onclick="assignRoles()">Assign Roles</button>
</div>

<div id="gameArea" class="hidden">
  <h2 id="phaseTitle"></h2>
  <div id="actionArea"></div>
  <div id="message"></div>
  <button id="nextButton" class="hidden" onclick="nextPlayer()">Next Player</button>
</div>

<script>
let numPlayers, players=[], currentPlayer=0, mafiaVote=null, doctorChoice=null, detectiveChoice=null;
let nightPhase = true;

// Default roles
let roleList = ['Mafia', 'Mafia', 'Detective', 'Doctor', 'Jester'];

function startSetup() {
  numPlayers = parseInt(document.getElementById('numPlayers').value);
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('playerNames').classList.remove('hidden');

  const inputsDiv = document.getElementById('nameInputs');
  inputsDiv.innerHTML = '';
  for(let i=0;i<numPlayers;i++){
    const input = document.createElement('input');
    input.placeholder = 'Player '+(i+1);
    inputsDiv.appendChild(input);
  }
}

function assignRoles() {
  const inputs = document.querySelectorAll('#nameInputs input');
  players = Array.from(inputs).map(input => ({
    name: input.value || 'Player',
    role: '',
    alive: true
  }));

  let assignedRoles = [...roleList];
  while(assignedRoles.length < numPlayers) assignedRoles.push('Villager');
  assignedRoles = shuffleArray(assignedRoles);
  players.forEach((p,i)=>p.role=assignedRoles[i]);

  document.getElementById('playerNames').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');
  currentPlayer=0;
  startNightPhase();
}

function startNightPhase() {
  nightPhase = true;
  currentPlayer = 0;
  mafiaVote = null; doctorChoice = null; detectiveChoice = null;
  document.getElementById('phaseTitle').textContent = "Night Phase";
  document.getElementById('actionArea').innerHTML = '';
  document.getElementById('message').textContent = '';
  nextPlayer();
}

function nextPlayer() {
  const actionArea = document.getElementById('actionArea');
  const nextBtn = document.getElementById('nextButton');
  actionArea.innerHTML = '';
  nextBtn.classList.add('hidden');

  const alivePlayers = players.filter(p=>p.alive);

  // Mafia act as a team
  if(currentPlayer===0){
    const mafiaPlayers = players.filter(p=>p.alive && p.role==='Mafia');
    playAudio(`Mafia, you are alive. Discuss and choose one player to kill.`);
    actionArea.innerHTML = '<p>Mafia, discuss and then enter the name of the player to kill:</p>';
    const input = document.createElement('input'); input.placeholder='Target name';
    const btn = document.createElement('button'); btn.textContent='Submit';
    btn.onclick=()=>{
      mafiaVote = input.value;
      currentPlayer++;
      nextPlayer();
    }
    actionArea.appendChild(input); actionArea.appendChild(btn);
    return;
  }

  // Doctor chooses
  if(currentPlayer===1){
    const doctor = players.find(p=>p.alive && p.role==='Doctor');
    if(doctor){
      playAudio(`${doctor.name}, you are the Doctor. Choose someone to save.`);
      actionArea.innerHTML = `<p>Doctor, enter the name of the player to save:</p>`;
      const input = document.createElement('input'); input.placeholder='Player name';
      const btn = document.createElement('button'); btn.textContent='Submit';
      btn.onclick=()=>{
        doctorChoice = input.value;
        currentPlayer++;
        nextPlayer();
      }
      actionArea.appendChild(input); actionArea.appendChild(btn);
      return;
    } else currentPlayer++;
  }

  // Detective chooses
  if(currentPlayer===2){
    const detective = players.find(p=>p.alive && p.role==='Detective');
    if(detective){
      playAudio(`${detective.name}, you are the Detective. Choose someone to check.`);
      actionArea.innerHTML = `<p>Detective, enter the name of the player to check:</p>`;
      const input = document.createElement('input'); input.placeholder='Player name';
      const btn = document.createElement('button'); btn.textContent='Submit';
      btn.onclick=()=>{
        detectiveChoice = input.value;
        currentPlayer++;
        nextPlayer();
      }
      actionArea.appendChild(input); actionArea.appendChild(btn);
      return;
    } else currentPlayer++;
  }

  // Resolve Night
  resolveNight();
}

function resolveNight(){
  const actionArea = document.getElementById('actionArea');
  let dead=null;

  // Mafia kills
  if(mafiaVote){
    if(mafiaVote !== doctorChoice){
      dead = players.find(p=>p.name===mafiaVote && p.alive);
      if(dead) dead.alive=false;
    }
  }

  actionArea.innerHTML = '<h3>Night Results</h3>';
  if(dead) actionArea.innerHTML += `<p>${dead.name} was killed!</p>`;
  else actionArea.innerHTML += `<p>No one died.</p>`;

  // Detective info
  if(detectiveChoice){
    const checked = players.find(p=>p.name===detectiveChoice);
    if(checked){
      const detective = players.find(p=>p.role==='Detective' && p.alive);
      document.getElementById('message').textContent = `${detective.name}, ${checked.name}'s role is ${checked.role}`;
    }
  }

  // Check win conditions
  const aliveMafia = players.filter(p=>p.alive && p.role==='Mafia').length;
  const aliveTown = players.filter(p=>p.alive && p.role!=='Mafia').length;

  if(aliveMafia===0){
    actionArea.innerHTML += `<h2>Town wins!</h2>`;
  } else if(aliveMafia >= aliveTown){
    actionArea.innerHTML += `<h2>Mafia wins!</h2>`;
  } else {
    actionArea.innerHTML += `<button onclick="startNightPhase()">Next Night</button>`;
  }
}

function playAudio(text){
  const msg = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(msg);
}

function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}
</script>

</body>
</html>
